Resources:
  CloudPouchCostsPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: CloudPouch-costs-policy
      Description: Policy for CloudPouch application to access billing costs and various AWS services
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - application-autoscaling:DescribeScalableTargets
              - ce:GetCostAndUsage
              - cloudwatch:GetMetricStatistics
              - dynamodb:DescribeTable
              - dynamodb:ListTables
              - ec2:Describe*
              - ebs:ListChangedBlocks
              - ebs:ListSnapshotBlocks
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetHealth
              - logs:DescribeLogGroups
              - organizations:ListAccounts
              - rds:DescribeDBClusters
              - rds:DescribeDBInstances
              - rds:DescribeDBSnapshots
              - elasticfilesystem:DescribeFileSystems
              - rds:GetMetricData
              - s3:ListBuckets
              - cloudwatch:GetMetricData
              - ec2:GetMetricData
              - autoscaling:DescribeAutoScalingGroups
              - compute-optimizer:GetEC2InstanceRecommendation
            Resource: '*'
